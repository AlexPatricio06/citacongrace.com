<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una invitación especial 💌</title><style>:root{--vino:#7c314b;--rosa:#f3cbd4;--crema:#fff9f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#ffe7ed,#fff9f4 70%);font-family:Georgia,serif;color:var(--vino);overflow-x:hidden}.card{width:min(90%,460px);padding:35px 27px;text-align:center;border-radius:24px;background:#ffffffd9;box-shadow:0 20px 65px #7c314b25;position:relative}h1{font-size:clamp(27px,6vw,39px);font-weight:normal}p{line-height:1.7;font-size:18px}.envelope{font-size:95px;cursor:pointer;border:0;background:none;transition:transform .3s}.envelope:hover{transform:scale(1.1)}.hidden{display:none}.btn{display:inline-block;border:0;border-radius:50px;padding:13px 24px;margin:8px;background:var(--vino);color:white;text-decoration:none;font:16px system-ui;cursor:pointer}.secondary{background:#f5dce3;color:var(--vino)}.heart{position:fixed;top:-30px;animation:fall 5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}small{font:13px system-ui;color:#986a7a}</style></head><body><main class="card"><div id="inicio"><p>Para alguien muy especial ♡</p><button class="envelope" onclick="abrir()" aria-label="Abrir invitación">💌</button><h1>Tienes una invitación...</h1><p>Toca el sobre para descubrirla</p></div><section id="carta" class="hidden"><div style="font-size:40px">♡</div><h1 id="titulo">¿Te gustaría tener una cita conmigo?</h1><p id="mensaje">Quiero compartir un momento bonito contigo, lleno de risas, pláticas y recuerdos especiales.</p><p><strong id="fecha">Próximamente</strong><br><span id="lugar">Un lugar especial</span></p><a id="mapa" class="btn secondary hidden" target="_blank" rel="noopener">📍 Ver ubicación</a><br><button class="btn" onclick="aceptar()">¡Sí, acepto! ❤️</button><p id="respuesta" aria-live="polite"></p><small>Hecho con mucho cariño ♡</small></section></main><script>const q=new URLSearchParams(location.search);function poner(id,key){if(q.get(key))document.getElementById(id).textContent=q.get(key)}poner('titulo','titulo');poner('mensaje','mensaje');poner('fecha','fecha');poner('lugar','lugar');if(q.get('mapa')&&/^https:\/\//.test(q.get('mapa'))){const a=document.getElementById('mapa');a.href=q.get('mapa');a.classList.remove('hidden')}function abrir(){document.getElementById('inicio').classList.add('hidden');document.getElementById('carta').classList.remove('hidden');for(let i=0;i<26;i++)setTimeout(corazon,i*110)}function corazon(){let e=document.createElement('span');e.className='heart';e.textContent=['❤️','💕','♡','🌸'][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+'vw';e.style.fontSize=(15+Math.random()*20)+'px';document.body.append(e);setTimeout(()=>e.remove(),5100)}function aceptar(){document.getElementById('respuesta').textContent='¡Qué emoción! 💕 Mándame un mensajito para confirmarlo.';for(let i=0;i<20;i++)setTimeout(corazon,i*100)}</script></body></html>
